# age recipients derived with ssh-to-age from existing ed25519 keys.
# Add a host: ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub, list it here,
# then run: sops updatekeys secrets/secrets.yaml
keys:
  - &kuro age1v2vdu4cqz98gcg6r4vuvknraqqn5yupkcrf9nnzln9l4c322dyts6yu2yp # ~/.ssh/id_ed25519 (edit + decrypt on every host)
  - &laptop age1t9mmnv8gpdptg0htr7unkrfmumyt38pqt44rqvh50fsuz3ws7uyshr0uwl # laptop /etc/ssh/ssh_host_ed25519_key
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *kuro
          - *laptop
