onboarding = false

[keys]
prefix = "alt+w"
settings = "prefix+i"
copy_mode = "prefix+v"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
previous_agent = "alt+ctrl+k"
next_agent = "alt+ctrl+j"
toggle_sidebar = "prefix+e"

# create/rename/close tabs, panes and workspaces: the prefix+tab / prefix+w / prefix+s chord popups below
new_tab = ""
rename_tab = ""
close_tab = ""
previous_tab = "alt+h"
next_tab = "alt+l"
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"
zoom = "prefix+z"
detach = "prefix+d"

split_vertical = "prefix+|"
split_horizontal = "prefix+-"
rename_pane = ""
close_pane = ""
# like nvim's jump list; frees prefix+tab / prefix+shift+tab
cycle_pane_previous = "prefix+ctrl+o"
cycle_pane_next = "prefix+ctrl+i"

# s = workspaces (chord below); frees prefix+w (default workspace_picker) for the pane chord
workspace_picker = "prefix+shift+w"
goto = "prefix+shift+s"
new_workspace = ""
rename_workspace = ""
close_workspace = ""

new_worktree = "prefix+alt+g"
open_worktree = "prefix+shift+g"
remove_worktree = "prefix+ctrl+g"

# tmux-style second key: tab (new) d (close) r (rename) h/l (close left/right)
[[keys.command]]
key = "prefix+tab"
type = "popup"
command = "herdr-chord tab"
description = "tab: tab new, d close, r rename, h/l close left/right"
width = 80
height = 3

# w (split right) d (close) r (rename)
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "herdr-chord pane"
description = "pane: w split right, d close, r rename"
width = 56
height = 3

# s (new) d (close) r (rename)
[[keys.command]]
key = "prefix+s"
type = "popup"
command = "herdr-chord workspace"
description = "workspace: s new, d close, r rename"
width = 48
height = 3

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "live-sync-panes.broadcast"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "live-sync-panes.sync"


[keys.indexed]
tabs = "alt"
workspaces = "alt+shift"
agents = "alt+ctrl"

[ui]
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
status_indicators = "symbols"
agent_panel_sort = "priority"
accent = "magenta"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

[advanced]
scrollback_limit_bytes = 10000000

[remote]
manage_ssh_config = false
