onboarding = false

[keys]
prefix = "alt+w"
settings = "prefix+i"
copy_mode = "prefix+v"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
previous_agent = "alt+ctrl+k"
next_agent = "alt+ctrl+j"
toggle_sidebar = "prefix+e"

# create/rename/close tabs, panes and workspaces: the prefix+tab / prefix+w / prefix+s chord popups below
new_tab = ""
rename_tab = ""
close_tab = ""
previous_tab = "alt+h"
next_tab = "alt+l"
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"
zoom = "prefix+z"
detach = "prefix+d"

split_vertical = "prefix+|"
split_horizontal = "prefix+-"
rename_pane = ""
close_pane = ""
# like nvim's jump list; frees prefix+tab / prefix+shift+tab
cycle_pane_previous = "prefix+ctrl+o"
cycle_pane_next = "prefix+ctrl+i"

# s = workspaces (chord below); frees prefix+w (default workspace_picker) for the pane chord
workspace_picker = "prefix+shift+w"
goto = "prefix+shift+s"
new_workspace = ""
rename_workspace = ""
close_workspace = ""

# g = worktrees (picker below)
new_worktree = ""
open_worktree = ""
remove_worktree = ""

# tmux-style second key: tab (new) d (close) r (rename) h/l (close left/right)
[[keys.command]]
key = "prefix+tab"
type = "popup"
command = "herdr-chord tab"
description = "tab: tab new, d close, r rename, h/l close left/right"
width = 80
height = 3

# w (split right) d (close) r (rename)
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "herdr-chord pane"
description = "pane: w split right, d close, r rename"
width = 56
height = 3

# s (new) d (close) r (rename)
[[keys.command]]
key = "prefix+s"
type = "popup"
command = "herdr-chord workspace"
description = "workspace: s new, d close, r rename"
width = 48
height = 3

# fuzzy-find a branch: go to its worktree, else create one; ctrl-x removes
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "herdr-worktree"
description = "worktree: find, open or create; ctrl-x remove"
width = 90
height = 20

# m = move to the server, so sessions keep running while this machine is off (herdr-ship).
# m asks the focused agent to pick the files it needs and move itself; shift+m moves every omp
# session right away (cwd's git repo only; a mid-turn agent is cut off and finishes on the server).
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "herdr-ship --ask"
description = "ask the focused agent to move itself to the server"
width = 90
height = 8

[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = "herdr-ship --all"
description = "move every omp session to the server now"
width = 90
height = 24

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "live-sync-panes.broadcast"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "live-sync-panes.sync"


[keys.indexed]
tabs = "alt"
workspaces = "alt+shift"
agents = "alt+ctrl"

[ui]
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
status_indicators = "symbols"
agent_panel_sort = "priority"
accent = "magenta"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

[advanced]
scrollback_limit_bytes = 10000000

[remote]
manage_ssh_config = false
